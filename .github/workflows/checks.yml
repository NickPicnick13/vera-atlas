name: Build and test (macOS source)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python tests (stdlib)
        run: python3 -B -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check sphere.js
          node --check atlas.js
      - name: Reversible comet animation test
        run: node tests/atlas_comets_qa.js
      - name: Additive comet paths (event-seeded variants)
        run: node tests/atlas_comet_variants_qa.js
      - name: Verify full-screen real graph boundary fitting
        run: node tests/atlas_frame_fit_qa.js
      - name: Verify deterministic synthetic graph
        run: |
          python3 -B examples/generate_demo.py
          git diff --exit-code -- examples/demo-graph.json
      - name: Compile optional local presentation control
        run: swiftc tools/atlas_live_bridge.swift -o /tmp/vera-atlas-control-cli
      - name: Build ad-hoc-signed macOS app
        run: ./make_app.sh
      - name: Test backdrop display placement (when multiple displays attached)
        run: .build/app/VeraAtlas.app/Contents/MacOS/VeraAtlas --selftest-backdrop-displays
      - name: Validate native graph export
        run: |
          .build/app/VeraAtlas.app/Contents/MacOS/VeraAtlas --export-atlas-base > /tmp/vera-atlas-public-graph.json
          python3 -c 'import json; d=json.load(open("/tmp/vera-atlas-public-graph.json")); assert len(d["nodes"])>=4506; assert len(d["edges"])>=4786'
          codesign --verify --strict .build/app/VeraAtlas.app
