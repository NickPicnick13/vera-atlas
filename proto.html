<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Атлас памяти</title>
<script>if (location.hash === '#embed') document.documentElement.classList.add('embed');</script>
<style>
  :root {
    color-scheme: dark;
    --space: #0a0b15;
    --ink: #edf0ff;
    --secondary: #a9b2cd;
    --line: #a7bafd22;
    --focus: #b6c5ff;
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    background: var(--space);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { display: grid; place-items: center; }
  [hidden] { display: none !important; }
  main {
    width: min(100%, 760px); height: min(100%, 640px); min-width: 0; min-height: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--space); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  html.embed main { width: 100%; height: 100%; border: 0; border-radius: 0; grid-template-rows: minmax(0, 1fr); }
  /* #embed: only the cloud over the desktop — every chrome element is transparent or hidden. */
  html.embed, html.embed body { background: transparent !important; }
  html.embed main, html.embed .stage { background: transparent !important; border: 0 !important; box-shadow: none !important; }
  html.embed header, html.embed footer, html.embed .note, html.embed .zoom-tools,
  html.embed h1, html.embed .mode, html.embed .brand, html.embed nav { display: none !important; }
  html.embed canvas { outline: none !important; }
  html.embed canvas:focus, html.embed canvas:focus-visible { outline: none !important; }
  header, footer { display: flex; align-items: center; justify-content: space-between; min-width: 0; gap: 8px; }
  header { padding: 5px 10px 5px 13px; min-height: 40px; border-bottom: 1px solid var(--line); background: #10111c; }
  .brand, nav, .clock { display: flex; align-items: center; min-width: 0; }
  .brand { gap: 9px; flex-wrap: wrap; }
  .mark { width: 21px; height: 21px; color: #b4c2ff; flex: none; }
  h1 { font-size: 14px; line-height: 1.2; font-weight: 590; letter-spacing: -.014em; margin: 0; }
  .mode { color: var(--secondary); font-size: 11px; }
  nav { flex: none; gap: 3px; }
  .control {
    display: grid; place-items: center; padding: 0; width: 30px; height: 30px;
    cursor: pointer; border: 1px solid transparent; border-radius: 6px;
    color: #c0c7e1; background: transparent; font: inherit;
  }
  .control:hover:not(:disabled) { color: white; background: #b8bffa19; }
  .control:active:not(:disabled) { background: #b8bffa2b; }
  .control:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .control[aria-pressed="true"] { background: #a3aeff1d; border-color: var(--line); color: #e0e5ff; }
  .control:disabled { opacity: .36; cursor: default; }
  .control svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
  html:not(.embed) .native { display: none; }
  .stage {
    min-height: 0; min-width: 0; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 49% 49%, #141327 0, #0e101d 50%, var(--space) 83%);
  }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .note { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; margin: 0; padding: 12px; color: var(--secondary); pointer-events: none; }
  footer { min-height: 35px; padding: 3px 11px 3px 13px; border-top: 1px solid var(--line); background: #0e101b; }
  .reading { display: flex; align-items: baseline; flex-wrap: wrap; min-width: 0; gap: 0 7px; font-size: 11px; color: var(--secondary); }
  #state { font-weight: 550; line-height: 1.35; }
  #detail { font-size: inherit; line-height: inherit; overflow-wrap: anywhere; }
  footer[data-focus="yes"] #state { color: #ffadaf; }
  .clock { gap: 6px; white-space: nowrap; color: var(--secondary); font-size: 11px; }
  time { color: #dce4fb; font-variant-numeric: tabular-nums; font-size: 12px; }
  #replay { width: 27px; height: 27px; }
  #recent { width: auto; min-width: 46px; font-size: 10px; letter-spacing: .02em; padding: 0 5px; }
  .tools { display: flex; align-items: center; gap: 8px; flex: none; }
  .zoom-tools {
    position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; padding: 4px;
    border: 1px solid var(--line); border-radius: 8px; background: #0e101bd9;
  }
  .zoom-tools .zoom { width: 26px; height: 26px; }
  @media (max-width: 360px) {
    header, footer { padding-inline: 8px; } .brand, .tools { gap: 5px; }
    .zoom-tools { right: 6px; bottom: 6px; gap: 3px; padding: 3px; }
    .zoom-tools .zoom { width: 24px; height: 24px; }
  }
</style>
</head>
<body>
<main aria-label="Атлас памяти">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5 15 7-10 7 8-7 7-7-5 14-2" stroke="currentColor" opacity=".55"/>
        <circle cx="5" cy="15" r="1.7" fill="currentColor"/><circle cx="12" cy="5" r="1.65" fill="currentColor"/>
        <circle cx="19" cy="13" r="1.85" fill="currentColor"/><circle cx="12" cy="20" r="1.35" fill="currentColor"/>
      </svg>
      <h1>Атлас памяти</h1><span class="mode" id="mode" hidden><span></span></span>
    </div>
    <nav aria-label="Окно">
      <button class="control native" id="pin" title="Поверх окон" type="button" aria-label="Поверх окон" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m13.5 2.5 4 4-3 1-3.7 5.3-1.6-.5L5 16.5l-1 .4.4-1L8.7 11l-.5-1.6L13 5.6z"/></svg></button>
      <button class="control native" id="hide" title="Свернуть" type="button" aria-label="Свернуть"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 11h12"/></svg></button>
    </nav>
  </header>
  <section class="stage" aria-label="Карта связей"><canvas id="graph" role="img" aria-label="Светящееся облако узлов памяти"></canvas><p class="note" id="note" hidden></p>
    <div class="zoom-tools" aria-label="Масштаб карты">
      <button class="control zoom" id="zoomOut" type="button" title="Отдалить (+/- с клавиатуры)" aria-label="Отдалить карту"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button>
      <button class="control zoom" id="zoomIn" type="button" title="Приблизить (+/- с клавиатуры)" aria-label="Приблизить карту"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
      <button class="control zoom" id="zoomReset" type="button" title="Сбросить вид (0)" aria-label="Сбросить вид карты"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7V4h3M13 4h3v3M16 13v3h-3M7 16H4v-3"/></svg></button>
    </div>
  </section>
  <footer>
    <div class="reading" aria-live="polite"><span id="state"></span><span id="detail"></span></div>
    <div class="tools">
      <span class="clock" title="Местное время"><span>Местное</span><time id="clock" aria-label="Местное время"></time></span>
      <button class="control" id="replay" title="Повторить последний выбор памяти" type="button" aria-label="Повторить последний выбор памяти" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6.3 6.3 0 1 1-.1 4M4 3v5h5"/></svg></button><button class="control" id="recent" title="Маршруты последних 10 минут" type="button" aria-label="Повторить недавнюю активность">10 мин</button><button class="control" id="focusSource" style="width:auto;min-width:53px;padding:0 6px;font-size:10px" type="button" title="Фокус по реально наблюдавшимся источникам" aria-label="Фокус на источнике">Фокус</button>
    </div>
  </footer>
</main>
<script src="sphere.js"></script>
<script src="atlas.js"></script>
</body>
</html>
